/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 2
        max_iteration: 4
        filter_size_surf: 0.6
        filter_size_map: 0.5
        cube_side_length: 500.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic: "/rslidar_points"
            imu_topic: "/ascento/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms (LI-Init)
            # Used no matter what time_sync_en is. If the time offset is not known exactly, please set 0.0

        preprocess:
            lidar_type: 5 # 1 Livox, 2 Velodyne, 3 Ouster, 4 rest, 5 RoboSense
            scan_line: 4
            blind: 0.3
            timestamp_unit: 3  # Unused for lidar_type 5 (RoboSense); timestamps read directly from PointCloud2 bytes
            scan_rate: 10

        mapping:
            acc_cov: 0.1       # IEKF process noise, NOT raw sensor noise. Controls IMU-vs-scan-matching balance.
            gyr_cov: 0.1       # Higher = scan matching has more authority to correct IMU drift.
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 120.0
            det_range: 30.0
            extrinsic_est_en: false       # Online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [0.1686, 0.0000, 0.1170]
            extrinsic_R: [1., 0., 0.,
                          0., 1., 0.,
                          0., 0., 1.]

        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: false                 # true: publish Map cloud
            scan_publish_en: true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: false
            interval: -1                 # how many LiDAR frames saved in each pcd file;
            # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

        # Covariance floor: IEKF reports unrealistically low covariance (~1e-6).
        # Floor to realistic values so downstream EKF doesn't over-trust LIO.
        covariance:
            min_pose: 0.01       # m^2 / rad^2 -- ~10cm 1-sigma position
            min_twist: 0.001     # (m/s)^2 / (rad/s)^2

        # Initial pose: wait for IMU pose in odom frame before processing.
        # Fast-LIO looks up the TF odom_frame -> imu_frame at startup.
        # This aligns camera_init with odom so positions are directly usable.
        # Also accepts pose via /fast_lio/set_initial_pose topic as fallback.
        initial_pose:
            require: true
            odom_frame: "ascento/odom"
            imu_frame: "imu_link"
