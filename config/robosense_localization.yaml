/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4
        max_iteration: 2
        filter_size_surf: 0.6
        filter_size_map: 0.5
        cube_side_length: 200.0       # Smaller cube for sliding window localization
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/rslidar_points"
            imu_topic:  "/ascento/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 4                # 4 = generic pointcloud
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    120.0
            det_range:     30.0
            extrinsic_est_en:  false
            extrinsic_T: [ 0.1686, 0.0000, 0.0430]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: false
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1

        # Localization mode: match scans against a pre-built map
        localization:
            enabled: true
            prior_map_path: "/path/to/prior_map.ply"       # PLY file (georeferenced UTM)
            map_downsample_resolution: 0.5                  # VoxelGrid leaf size for prior map
            utm_offset: [0.0, 0.0, 0.0]                    # [easting, northing, altitude] subtracted from map and GPS
            gnss_topic: "/fixposition/utm/odometry"         # nav_msgs/Odometry in UTM frame
            initial_yaw_from_gnss: true                     # Use GNSS heading for initial orientation
